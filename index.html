                    { id: 5, name: "Limitador de fim de curso funcionando", icon: Icons.lock },
                    { id: 6, name: "Controle/botoeira funcionando e sem botões travados", icon: Icons.tool },

                    { id: 2, name: "Trilhos", icon: "🛤️" },
                    { id: 3, name: "Controle", icon: Icons.tool },
                    { id: 4, name: "Equipamento identificado", icon: Icons.target },
                    { id: 5, name: "Mecanismo de deslocamento lateral", icon: Icons.tool },
                    { id: 6, name: "Cabo de alimentação elétrica", icon: Icons.power },
                    { id: 7, name: "Cabo de aço", icon: Icons.link },
                    { id: 8, name: "Mecanismo de translação no trilho", icon: "⚙️" },
                    { id: 9, name: "Sinal sonoro", icon: Icons.volume },
                    { id: 10, name: "Bloco de carga possui trava de segurança", icon: Icons.lock },
                    { id: 11, name: "Engrenagem das rodas de tração", icon: "⚙️" },
                    { id: 12, name: "Rodas livres em bom estado", icon: "🔘" },

        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [user, setUser] = useState(null);
            const [usersList, setUsersList] = useState([]);
            const [currentView, setCurrentView] = useState("login");

            const [loginUser, setLoginUser] = useState("");
            const [loginPass, setLoginPass] = useState("");
            const [regFirstName, setRegFirstName] = useState("");
            const [regLastName, setRegLastName] = useState("");
            const [regPass, setRegPass] = useState("");

            const [editingUserIndex, setEditingUserIndex] = useState(null);
            const [adminNewPassword, setAdminNewPassword] = useState("");

            const [selectedMachine, setSelectedMachine] = useState("maquina_tinta");
            const [checklistItems, setChecklistItems] = useState({});
            const [observations, setObservations] = useState({});
            const [customNcTexts, setCustomNcTexts] = useState({});
            const [savedChecklists, setSavedChecklists] = useState([]);
            const [activeInspection, setActiveInspection] = useState(null);

            const [searchQuery, setSearchQuery] = useState("");
            const [filterStatus, setFilterStatus] = useState("all");
            const [sortOrder, setSortOrder] = useState("desc");
            const [expandedDates, setExpandedDates] = useState({});

            useEffect(() => {
                setTimeout(() => {
                    const storedUsers = localStorage.getItem("checkpro_users");
                    let initialUsers = storedUsers ? JSON.parse(storedUsers) : [
                        { firstName: "Master", lastName: "Admin", username: "master", pass: "master", role: "admin" }
                    ];
                    setUsersList(initialUsers);
                    localStorage.setItem("checkpro_users", JSON.stringify(initialUsers));

                    const activeSession = localStorage.getItem("checkpro_session");
                    if (activeSession) {
                        try {
                            const parsedUser = JSON.parse(activeSession);
                            setUser(parsedUser);
                            setCurrentView("home");
                        } catch(e) {
                            setCurrentView("login");
                        }
                    } else {
                        setCurrentView("login");
                    }

                    const data = localStorage.getItem("checkpro_checklists_db");
                    if (data) {
                        try { setSavedChecklists(JSON.parse(data)); } catch(e) {}
                    }

                    setIsLoading(false);
                }, 1200);
            }, []);

            const saveChecklists = (newList) => {
                setSavedChecklists(newList);
                localStorage.setItem("checkpro_checklists_db", JSON.stringify(newList));
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const found = usersList.find(u => u.username.toLowerCase() === loginUser.toLowerCase() && u.pass === loginPass);
                if (found) {
                    setUser(found);
                    localStorage.setItem("checkpro_session", JSON.stringify(found));
                    setCurrentView("home");
                    setLoginUser("");
                    setLoginPass("");
                } else {
                    alert("Usuário ou senha incorretos!");
                }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                if (!regFirstName || !regLastName || !regPass) return alert("Preencha todos os campos!");
                const username = (regFirstName + "." + regLastName).toLowerCase().replace(/\s+/g, '');
                if (usersList.some(u => u.username === username)) {
                    return alert("Este usuário já existe!");
                }
                const newUser = {
                    firstName: regFirstName,
                    lastName: regLastName,
                    username: username,
                    pass: regPass,
                    role: "comum"
                };
                const updatedUsers = [...usersList, newUser];
                setUsersList(updatedUsers);
                localStorage.setItem("checkpro_users", JSON.stringify(updatedUsers));
                alert(`Usuário cadastrado com sucesso! Seu login é: ${username}`);
                setUser(newUser);
                localStorage.setItem("checkpro_session", JSON.stringify(newUser));
                setCurrentView("home");
            };

            const handleLogout = () => {
                if (confirm("Deseja realmente sair da sua conta?")) {
                    localStorage.removeItem("checkpro_session");
                    setUser(null);
                    setCurrentView("login");
                }
            };

            const startChecklist = (machineKey) => {
                setSelectedMachine(machineKey);
                const mach = MACHINES_DATA[machineKey];
                const initial = {};
                mach.items.forEach(item => { initial[item.id] = "C"; });
                setChecklistItems(initial);
                setObservations({});
                setCustomNcTexts({});
                setCurrentView("checklist");
            };

            const handleNcDropdownChange = (itemId, val) => {
                setObservations(prev => ({ ...prev, [itemId]: val }));
            };

            const saveNewChecklistRecord = () => {
                const mach = MACHINES_DATA[selectedMachine];
                const now = new Date();

                const processedItems = mach.items.map(it => {
                    const st = checklistItems[it.id] || "C";
                    let obs = observations[it.id] || "";
                    if (st === "NC" && (obs.includes("Outro") || !obs)) {
                        obs = customNcTexts[it.id] || "Não Conforme sem descrição especificada";
                    }
                    return {
                        id: it.id,
                        name: it.name,
                        status: st,
                        observation: obs
                    };
                });

                const newRecord = {
                    id: Date.now(),
                    machineKey: selectedMachine,
                    machineName: mach.name,
                    sector: mach.sector,
                    operator: `${user.firstName} ${user.lastName}`,
                    dateStr: now.toLocaleDateString('pt-BR'),
                    timeStr: now.toLocaleTimeString('pt-BR'),
                    timestamp: now.getTime(),
                    items: processedItems
                };

                const updatedList = [newRecord, ...savedChecklists];
                saveChecklists(updatedList);
                alert("Checklist salvo com sucesso!");
                setActiveInspection(newRecord);
                setCurrentView("details");
            };

            const deleteChecklist = (id) => {
                if (user.role !== 'admin') return alert("Apenas administradores podem excluir.");
                if (confirm("Confirma a exclusão deste checklist do banco de dados?")) {
                    const filtered = savedChecklists.filter(item => item.id !== id);
                    saveChecklists(filtered);
                    setCurrentView("history");
                }
            };

            const handleAdminChangePassword = (targetUsername) => {
                if (!adminNewPassword) return alert("Digite a nova senha!");
                const updated = usersList.map(u => {
                    if (u.username === targetUsername) u.pass = adminNewPassword;
                    return u;
                });
                setUsersList(updated);
                localStorage.setItem("checkpro_users", JSON.stringify(updated));
                alert(`Senha do usuário @${targetUsername} alterada com sucesso!`);
                setEditingUserIndex(null);
                setAdminNewPassword("");
            };

            const filteredChecklists = savedChecklists.filter(item => {
                const matchQuery = item.dateStr.includes(searchQuery) || item.machineName.toLowerCase().includes(searchQuery.toLowerCase()) || item.operator.toLowerCase().includes(searchQuery.toLowerCase());
                if (!matchQuery) return false;
                if (filterStatus === 'nc') return item.items.some(i => i.status === 'NC');
                if (filterStatus === 'na') return item.items.some(i => i.status === 'NA');
                return true;
            }).sort((a, b) => {
                if (sortOrder === 'asc') return a.timestamp - b.timestamp;
                if (sortOrder === 'machine') return a.machineName.localeCompare(b.machineName);
                return b.timestamp - a.timestamp;
            });

            const groupedByDate = {};
            filteredChecklists.forEach(item => {
                if (!groupedByDate[item.dateStr]) groupedByDate[item.dateStr] = [];
                groupedByDate[item.dateStr].push(item);
            });

            if (isLoading) {
                return (
                    <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6">
                        <div className="bg-blue-600 w-20 h-20 rounded-2xl flex items-center justify-center mb-6 shadow-2xl">
                            <span className="text-3xl font-extrabold text-white tracking-widest">CP</span>
                        </div>
                        <h1 className="text-2xl font-bold tracking-tight mb-2">CHECKPRO</h1>
                        <p className="text-sm text-slate-400 mb-8">Sistema Industrial de Checklist Diário</p>
                        
                        <div className="flex items-center space-x-3 bg-slate-800 px-5 py-3 rounded-xl border border-slate-700">
                            <div className="w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full spinner"></div>
                            <span className="text-xs font-semibold text-slate-300">Carregando Banco de Dados...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    <header className="bg-blue-800 text-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div 
                                onClick={() => user && setCurrentView("home")} 
                                className="flex items-center space-x-3 cursor-pointer group">
                                <div className="bg-white text-blue-800 font-extrabold px-3 py-1.5 rounded-xl text-sm shadow group-hover:bg-blue-50 transition">
                                    CHECKPRO
                                </div>
                                <div>
                                    <h1 className="font-bold text-base leading-tight">Checklist Industrial</h1>
                                    <p className="text-xs text-blue-200">🟢 Sistema Ativo</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2">
                                {user ? (
                                    <>
                                        <button onClick={() => setCurrentView("home")} className="px-3 py-1.5 bg-blue-700 hover:bg-blue-900 rounded-lg text-xs font-bold transition">Início</button>
                                        <button onClick={() => setCurrentView("history")} className="px-3 py-1.5 bg-blue-700 hover:bg-blue-900 rounded-lg text-xs font-bold transition">Histórico</button>
                                        {user.role === 'admin' && (
                                            <button onClick={() => setCurrentView("admin")} className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 rounded-lg text-xs font-bold transition">Gestão</button>
                                        )}
                                        <button onClick={() => setCurrentView("manual")} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-xs font-bold transition">Manual 📖</button>
                                        <button onClick={() => setCurrentView("profile")} className="px-3 py-1.5 bg-blue-700 hover:bg-blue-900 rounded-lg text-xs font-bold transition">Perfil</button>
                                        <button onClick={handleLogout} className="px-3 py-1.5 bg-red-600 hover:bg-red-700 rounded-lg text-xs font-bold transition">Sair</button>
                                    </>
                                ) : (
                                    <div className="flex space-x-2">
                                        <button onClick={() => setCurrentView("login")} className="px-3.5 py-1.5 bg-white text-blue-800 font-bold rounded-lg text-xs shadow">Entrar</button>
                                        <button onClick={() => setCurrentView("register")} className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 font-bold rounded-lg text-xs shadow">Registrar</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">

                        {currentView === "login" && (
                            <div className="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 border border-slate-200 mt-4">
                                <div className="text-center mb-6">
                                    <div className="bg-blue-100 text-blue-800 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 font-bold text-2xl">
                                        🔐

                                        <h4 className="font-bold text-slate-900 text-sm mb-1">1. Primeiro Acesso e Autenticação</h4>
                                        <p>O aplicativo exige obrigatoriamente entrar em uma conta. Utilize o usuário padrão <strong>master</strong> com a senha <strong>master</strong> ou clique em <em>Registrar</em> para criar uma nova conta de operador.</p>
                                    </div>

                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <h4 className="font-bold text-slate-900 text-sm mb-1">2. Como Preencher um Checklist</h4>
                                        <p>Selecione a máquina desejada na tela inicial. Para cada item da máquina, selecione uma das 3 opções:</p>
                                        <ul className="list-disc ml-5 mt-1 space-y-1">
                                            <li><strong className="text-green-700">Conforme (C):</strong> O equipamento está funcionando corretamente.</li>
                                            <li><strong className="text-red-700">Não Conforme (NC):</strong> Existe uma falha. Escolha o motivo no menu suspenso ou digite um texto livre.</li>
                                            <li><strong className="text-blue-700">Não Aplicável (NA):</strong> O item não se aplica àquele modelo de máquina.</li>
                                        </ul>
                                    </div>

                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <h4 className="font-bold text-slate-900 text-sm mb-1">3. Consulta e Gestão de Registros</h4>
                                        <p>Na aba <strong>Histórico</strong>, os registros ficam salvos e agrupados por data em formato sanfonado (árvore). Administradores podem alterar senhas de outros usuários e excluir registros no painel de <strong>Gestão</strong>.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentView === "profile" && user && (
                            <div className="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 border border-slate-200 space-y-6">
                                <h3 className="text-2xl font-bold text-slate-900 text-center">Perfil do Operador</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nova Senha</label>
                                        <input type="password" id="newPassInput" placeholder="Nova senha" className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none text-xs" />
                                    </div>
                                    <button onClick={() => {
                                        const val = document.getElementById("newPassInput").value;
                                        if (!val) return alert("Digite a nova senha!");
                                        const updatedUsers = usersList.map(u => {
                                            if (u.username === user.username) u.pass = val;
                                            return u;
                                        });
                                        setUsersList(updatedUsers);
                                        localStorage.setItem("checkpro_users", JSON.stringify(updatedUsers));
                                        alert("Sua senha foi alterada com sucesso!");
                                    }} className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow text-xs">Salvar Alterações</button>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-white border-t border-slate-200 py-4 mt-8 text-center text-xs text-slate-500">
                        CHECKPRO • Sistema Industrial de Checklist Diário &copy; 2026
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
